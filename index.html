<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Quotes generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Quotes generator</h1>
      </header>
      <main>
        <form id="quote-generator-form">
          <input
            type="text"
            placeholder="Enter the topic of the quote"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="quote" id="quote"></div>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/clairegoge" target="_blank"
          >Nonjabulo Claire Goge</a
        >
        and
        <a href="https://github.com/clairegoge/quotes-generator" target="_blank"
          >is open-sourced on Github</a
        >
        and is
        <a
          href="https://ai-quotes-generator-project.netlify.app/"
          target="_blank"
          >hosted on Netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
